org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.workers.max=2
android.useAndroidX=true
kotlin.code.style=official

org.gradle.caching=true
android.enableAdditionalTestOutput=true

# ── R8 / DEX Optimisation ─────────────────────────────────────────────────────
#
# R8 full mode: unlocks advanced optimisations that are not available in
# compatibility mode.  Includes:
#   • Aggressive class merging (vertical + horizontal)
#   • Interface merging
#   • Enum unboxing (replaces enum instances with ints)
#   • Dead-argument elimination
#   • Improved inlining
#
# Expected APK size reduction on release build: 40–60% vs. unminified debug.
android.enableR8.fullMode=true

# Kotlin 2.x Compose compiler plugin flag
kotlin.compose.compiler.stabilityConfigurationPath=
