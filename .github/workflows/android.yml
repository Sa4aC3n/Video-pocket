name: Android verification

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 29
            image: default
          - api: 36
            image: google_apis
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;35.0.0
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests, application and test APKs, and Android lint
        run: bash gradlew testDebugUnitTest assembleDebug assembleDebugAndroidTest assembleRelease lintDebug lintRelease --continue --stacktrace --console=plain
      - name: Audit packaged native alignment
        run: node scripts/check-native.mjs app/build/outputs/apk/release/app-release-unsigned.apk > app/build/reports/native-alignment.json
      - name: Verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-verification-api${{ matrix.api }}-${{ github.sha }}
          path: |
            app/build/reports/
            app/build/test-results/
            app/build/outputs/apk/debug/
            app/build/outputs/apk/release/
          if-no-files-found: warn

      - name: Enable emulator acceleration
        run: |
          sudo chmod 666 /dev/kvm
      - name: Reserve space for the emulator userdata image
        run: |
          # This disposable runner does not use .NET, Haskell, or native compilation.
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android/sdk/ndk
          df -h /
          available_kib=$(df -Pk / | awk 'NR==2 {print $4}')
          test "$available_kib" -ge 12582912
      - uses: reactivecircus/android-emulator-runner@v2
        env:
          VIDEOPOCKET_PUBLIC_SMOKE: 'true'
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.image }}
          arch: x86_64
          disk-size: 2048M
          ram-size: 2048M
          emulator-boot-timeout: 300
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -partition-size 2048
          disable-animations: true
          script: bash scripts/verify-device.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-device-evidence-api${{ matrix.api }}-${{ github.sha }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            app/build/outputs/connected_android_test_additional_output/
            app/build/reports/device/
          if-no-files-found: warn
